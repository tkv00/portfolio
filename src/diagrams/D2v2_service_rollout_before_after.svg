      --color-ink:    #0F1A2A;
      --color-muted:  #6B7280;
      --color-accent: #01438D;
      --font-sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-mono: 'IBM Plex Mono', 'Noto Sans KR', ui-monospace, monospace; }
      #D2v2_service_rollout_before_after-root { font-family: var(--font-sans); color: var(--color-ink); }
      #D2v2_service_rollout_before_after-root .diagram-container { width: 100%; overflow-x: auto; }
