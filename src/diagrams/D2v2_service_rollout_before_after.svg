<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 998 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d2v2-service-rollout-title d2v2-service-rollout-desc" id="D2v2_service_rollout_before_after-root">
  <title id="d2v2-service-rollout-title">서비스 배포 경로 전후</title>
  <desc id="d2v2-service-rollout-desc">Before는 GitHub 오케스트레이터가 Node, Java, CDK를 설치하고 cdk deploy EcsClusterStack으로 CloudFormation 스택을 갱신해 ECS 서비스를 바꿨고, After는 실행 중인 task definition을 조회해 이미지만 바꾼 새 revision을 등록한 뒤 update-service를 호출하고 services-stable을 기다린다.</desc>
